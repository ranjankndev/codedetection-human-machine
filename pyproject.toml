[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codedet"
version = "0.1.0"
description = "Detecting machine-generated code and attributing the source LLM (SemEval-2026 Task 13)"
requires-python = ">=3.10"
# torch / transformers are NOT listed on purpose: Kaggle and Colab ship their own CUDA builds.
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "pyyaml", "tqdm", "pyarrow"]

[project.optional-dependencies]
ml = ["torch", "transformers"]
extra = ["peft", "lightgbm", "datasketch", "radon", "gradio", "matplotlib", "seaborn"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
