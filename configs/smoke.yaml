preset: smoke              # ~5 min on a Kaggle T4; proves the pipeline end to end on real data
seed: 42
budget_minutes: 10
data:
  root: /kaggle/input     # discover_data globs for parquet; override with --data for local runs
  task_a: {n_train: 2000, n_val: 500, n_ood: 800, holdout_language: Java, stratify_by: [label, language]}
  task_b: {n_train: 2500, n_val: 600, n_ood: 600, human_cap: 0.4, n_unseen_families: 3}
text: {max_len: 128, head_tokens: 96}
model: {base: microsoft/codebert-base, entropy_alpha: 0.15, style_dim: 32, classifier_hidden: 384}
train:
  epochs: 1
  batch_size: 16
  lr: 2.0e-5
  head_lr: 1.0e-4
  grad_accum: 1
  fp16: true
  patience: 1
  loss_task_a: ce
  loss_task_b: weighted_ce
eval: {batch_size: 64}
lm: {model: "Qwen/Qwen2.5-Coder-0.5B", max_len: 128, batch_size: 16, n_rows: 1200}
lora: {r: 8, alpha: 16}
bootstrap: {n_boot: 200}
seeds: {cheap_models: 3, transformers: 1}
bench: {batch_sizes: [1, 32], repeats: 20, warmup: 3}
models:
  task_a: [majority, length_only, tfidf_lr, style_gbdt, lm_gbdt, codebert, gpad, control]
  task_b: [majority, tfidf_lr, codebert_weighted, gpad_entropy_only]
optional_stages: [lm, lora, stack, bench, demo]
