preset: local_real         # real SemEval data on a laptop CPU (this machine has no GPU)
seed: 42
budget_minutes: 300
# Why this preset exists and what it costs:
# the comparison design (same rows, capacity control, CIs, OOD splits, calibration, cost threshold) is
# what this project is about, and all of it is encoder-agnostic. An 8-core CPU does roughly 20 GFLOPS of
# useful transformer work here, so codebert-base at 20k rows would take ~13 hours. This preset keeps the
# full experiment matrix and shrinks the two things that only affect the absolute numbers: the encoder
# (6-layer CodeBERTa-small, itself a code-pretrained RoBERTa) and the sample size.
# configs/lite.yaml is unchanged and is the intended portfolio run on a GPU.
data:
  root: data/              # parquet from the official release (Kaggle, or the HF mirror daniilor/SemEval-2026-Task13)
  task_a: {n_train: 500, n_val: 300, n_ood: 300, holdout_language: Java, stratify_by: [label, language]}
  task_b: {n_train: 500, n_val: 300, n_ood: 300, human_cap: 0.4, n_unseen_families: 3}
text: {max_len: 128, head_tokens: 96}
model: {base: huggingface/CodeBERTa-small-v1, entropy_alpha: 0.15, style_dim: 32, classifier_hidden: 256}
train:
  epochs: 2
  batch_size: 16
  lr: 3.0e-5
  head_lr: 2.0e-4
  grad_accum: 1
  fp16: false              # no CUDA here
  patience: 1
  loss_task_a: ce
  loss_task_b: weighted_ce
eval: {batch_size: 32}
lm: {model: "Qwen/Qwen2.5-Coder-0.5B", max_len: 128, batch_size: 8, n_rows: 6000}
lora: {r: 8, alpha: 16}
bootstrap: {n_boot: 1000}
seeds: {cheap_models: 3, transformers: 1}
bench: {batch_sizes: [1, 8], repeats: 10, warmup: 2}
stage_caps: {lm_features: 35, classical: 30, train: 90}
models:
  # ~20 min per transformer on this CPU, so the matrix is cut to the rows that carry a claim:
  # codebert / control / gpad is the capacity-controlled ablation, and task B needs a weighted-CE
  # baseline to test the old "entropy-only is best" story against. The sign-flip, LoRA and
  # style-only rows stay in configs/lite.yaml for the GPU run (listed in KNOWN_GAPS.md).
  task_a: [majority, length_only, tfidf_lr, style_gbdt, codebert, control, gpad, stack]
  task_b: [majority, tfidf_lr, codebert_weighted, gpad_entropy_only, stack]
optional_stages: [lm, lora, stack, bench, demo]
