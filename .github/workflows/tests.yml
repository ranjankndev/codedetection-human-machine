name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch only - the suite never downloads a model)
        run: |
          python -m pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" transformers lightgbm datasketch

      - name: Tests
        env:
          HF_HUB_OFFLINE: "1"        # the suite must pass with no network: tiny random encoder + fixtures
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -q

      - name: End-to-end dry run on synthetic fixtures
        run: |
          python scripts/make_fixture.py --n 300
          python scripts/run_all.py --preset local_cpu --cpu-only --data fixtures --out /tmp/ci_results --readme /dev/null --skip lm_features,bench
          python - <<'PY'
          import json, sys
          s = json.load(open("/tmp/ci_results/status.json"))
          print(json.dumps([{k: v for k, v in e.items() if k in ("stage", "status", "seconds")}
                            for e in s["stages"]], indent=1))
          sys.exit(0 if s["status"] == "ok" else 1)
          PY
